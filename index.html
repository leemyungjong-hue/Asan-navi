<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>웹페이지 보수중</title>
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

body {
/* 화면 전체 높이를 기준으로 상하좌우 중앙 정렬 /
display: flex;
justify-content: center;
align-items: center;
min-height: 100vh;
background-color: #f4f4f4; / 배경 확인용 연한 회색 (필요시 제거) */
font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
}

.maintenance-box {
/* 노란색 반투명 배경 (RGBA의 마지막 0.5가 투명도) */
background-color: rgba(255, 235, 59, 0.5);

/* 폰트 크기 및 스타일 */
font-size: 22px;
font-weight: bold;
color: #222222;

/* 박스 여백 및 테두리 디자인 */
padding: 30px 50px;
border: 2px solid rgba(255, 193, 7, 0.8);
border-radius: 10px;
box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
text-align: center;
}
</style>
</head>
<body>

<div class="maintenance-box">
웹페이지 보수중
</div>

</body>
</html>
