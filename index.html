opacity = 1;

});

// 엑셀 규칙을 완벽히 반영한 통합 단건 로케이션 파서
function parseLocation(query) {
var clean = query.toUpperCase().replace(/\s+/g, '').replace(/X/g, '');
if (!clean) return null;

// 구역명 추출 (1~2글자 영문)
var zone = clean.charAt(0);
if (clean.length > 1 && isNaN(clean.charAt(1))) {
zone = clean.substring(0, 2);
}

var remainder = clean.substring(zone.length);
if (remainder.length !== 4) return null; // 모든 로케이션은 영문+4자리 숫자 구조

var col = parseInt(remainder.charAt(0), 10);
var targetNum = parseInt(remainder.substring(1), 10);

// 세로형 구역 (Y, C, B, A) 규격: [열번호(1)][동서구분(1)][순서(2)]
if (zone === 'Y' || zone === 'C' || zone === 'B' || zone === 'A') {
var sideChar = remainder.charAt(1); // '0'=동쪽, '1'=서쪽
var subNum = parseInt(remainder.substring(2), 10); // 순서 2자리

for (var i = 0; i < locationDB.length; i++) {
var db = locationDB[i];
if (db.zone === zone && db.col === col) {
// 동쪽/서쪽 파트 매칭
var isWest = db.part.includes('서쪽');
if ((sideChar === '1' && isWest) || (sideChar === '0' && !isWest)) {
var minNo = db.startNo % 100;
var maxNo = db.endNo % 100;
if (subNum >= minNo && subNum <= maxNo) {
var ratio = (subNum - minNo) / Math.max(1, (maxNo - minNo));
var targetLat = db.sLat + (db.eLat - db.sLat) * ratio;
var targetLng = db.sLng + (db.eLng - db.sLng) * ratio;
return new naver.maps.LatLng(targetLat, targetLng);
}
}
}
}
}
// 가로형 구역 (H, K 등) 규격: [열번호(1)][순서(2)][앞뒤구분(1)]
else {
var seqNum = parseInt(remainder.substring(1, 3), 10); // 순서 2자리
var lineChar = remainder.charAt(3); // '1'=앞줄, '2'=뒷줄

for (var i = 0; i < locationDB.length; i++) {
var db = locationDB[i];
if (db.zone === zone && db.col === col) {
var isFront = db.part.includes('앞줄');
if ((lineChar === '1' && isFront) || (lineChar === '2' && !isFront)) {
var minNo = Math.floor((db.startNo % 1000) / 10);
var maxNo = Math.floor((db.endNo % 1000) / 10);
// 단순 선형 매칭 보정
var ratio = 0.5;
var targetLat = db.sLat + (db.eLat - db.sLat) * ratio;
var targetLng = db.sLng + (db.eLng - db.sLng) * ratio;
return new naver.maps.LatLng(targetLat, targetLng);
}
}
}
}

return null;
}

function searchLocation() {
window.closeGuide();
var rawInput = document.getElementById('search-input').value.trim();
var targetCoord = parseLocation(rawInput);
if (!targetCoord) {
alert("올바르지 않은 형식입니다: " + rawInput + "\n(입력 예시: Y1101, C1001 등)");
return;
}
window.activeTarget = targetCoord;
if (targetMarker) targetMarker.setMap(null);
targetMarker = new naver.maps.Marker({
map: map,
position: targetCoord,
icon: {
content: '<div style="font-size:24px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));">📍</div>',
anchor: new naver.maps.Point(12, 24)
}
});
map.setCenter(targetCoord);
map.setZoom(19);

document.getElementById('cancel-nav-btn').style.display = 'block';

if (currentPos) drawNavLine(currentPos, targetCoord);
}

function drawNavLine(start, end) {
if (navLine) navLine.setMap(null);
navLine = new naver.maps.Polyline({
map: map,
path: [start, end],
strokeColor: '#22c55e',
strokeWeight: 5,
strokeOpacity: 0.9
});
}

function cancelNavigation() {
window.activeTarget = null;
if (targetMarker) {
targetMarker.setMap(null);
targetMarker = null;
}
