function getDistance(lat1, lon1, lat2, lon2) {
var R = 6371e3;
var dLat = (lat2 - lat1) * Math.PI / 180;
var dLon = (lon2 - lon1) * Math.PI / 180;
var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
Math.sin(dLon/2) * Math.sin(dLon/2);
var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
return R * c;
}

function updateLabelSizes() {
var zoom = map.getZoom();
var fontSize = 13;
var opacity = 1;

if (zoom >= 15) {
var scale = Math.pow(1.3, zoom - 15);
fontSize = Math.round(13 * scale);
opacity = 1;
} else if (zoom === 14) {
fontSize = 9;
opacity = 1;
} else if (zoom === 13) {
fontSize = 5;
opacity = 1;
} else {
opacity = 0;
}

labelElements.forEach(el => {
el.style.fontSize = fontSize + 'px';
el.style.opacity = opacity;
});
}

naver.maps.Event.addListener(map, 'zoom_changed', updateLabelSizes);
setTimeout(updateLabelSizes, 300);

function parseLocation(query) {
var clean = query.toUpperCase().replace(/\s+/g, '').replace(/X/g, '');
if (!clean) return null;

var zone = clean.charAt(0);
if (clean.length > 1 && isNaN(clean.charAt(1))) {
zone = clean.substring(0, 2);
}

var remainder = clean.substring(zone.length);
var col = 0;
var seqNum = 0;
var lineChar = '';

if (zone === 'Y' || zone === 'C' || zone === 'B' || zone === 'A') {
if (remainder.length !== 4) return null;
col = parseInt(remainder.charAt(0), 10);
var sideChar = remainder.charAt(1);
var subNum = parseInt(remainder.substring(2), 10);
var isWest = (sideChar === '1');

for (var i = 0; i < locationDB.length; i++) {
var db = locationDB[i];
if (db.zone === zone && db.col === col) {
var matchSide = (isWest && db.part.includes('서쪽')) || (!isWest && db.part.includes('동쪽'));
if (matchSide || db.part === '') {
var minNo = db.startNo % 100;
var maxNo = db.endNo % 100;
if (subNum >= minNo && subNum <= maxNo) {
var ratio = (subNum - minNo) / Math.max(1, (maxNo - minNo));
var targetLat = db.sLat + (db.eLat - db.sLat) * ratio;
var targetLng = db.sLng + (db.eLng - db.sLng) * ratio;
return new naver.maps.LatLng(targetLat, targetLng);
}
}
}
}
}
else {
if (zone === 'HB' && remainder.startsWith('10')) {
col = 10;
seqNum = parseInt(remainder.substring(2, 4), 10);
lineChar = remainder.charAt(4) || '1';
} else if (remainder.length === 4) {
col = parseInt(remainder.charAt(0), 10);
seqNum = parseInt(remainder.substring(1, 3), 10);
lineChar = remainder.charAt(3);
} else {
return null;
}

for (var i = 0; i < locationDB.length; i++) {
var db = locationDB[i];
if (db.zone === zone && db.col === col) {
// [수정된 매칭 로직]: db.part에 '앞'이 포함되면서 lineChar가 '1'이거나, 혹은 db.part에 '뒤'가 포함되면서 lineChar가 '2'인 경우를 유연하게 판단
var isFrontQuery = (lineChar === '1');
var isRearQuery = (lineChar === '2');
var dbIsFront = db.part.includes('앞');
var dbIsRear = db.part.includes('뒤');

var matchLine = false;
if (dbIsFront && isFrontQuery) matchLine = true;
if (dbIsRear && isRearQuery) matchLine = true;
if (!dbIsFront && !dbIsRear) matchLine = true; // 단순 '앞줄' / '뒷줄' 또는 파트 구분 없는 경우

if (matchLine) {
var minNo = Math.floor((db.startNo % 1000) / 10);
var maxNo = Math.floor((db.endNo % 1000) / 10);
if (seqNum >= minNo && seqNum <= maxNo) {
var ratio = (seqNum - minNo) / Math.max(1, (maxNo - minNo));
var targetLat = db.sLat + (db.eLat - db.sLat) * ratio;
var targetLng = db.sLng + (db.eLng - db.sLng) * ratio;
return new naver.maps.LatLng(targetLat, targetLng);
}
}
}
}
}

return null;
}

function searchLocation() {
window.closeGuide();
var rawInput = document.getElementById('search-input').value.trim();
var targetCoord = parseLocation(rawInput);
if (!targetCoord) {
alert("올바르지 않은 형식입니다: " + rawInput + "\n(입력 예시: Y1101, HB3302, JA4302 등)");
return;
}
window.activeTarget = targetCoord;
if (targetMarker) targetMarker.setMap(null);

targetMarker = new naver.maps.Marker({
map: map,
position: targetCoord,
icon: {
content: '<div style="display:flex;align-items:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));"><span style="font-size:24px;">📍</span><span style="background:rgba(15,23,42,0.85);padding:2px 6px;border-radius:6px;color:#ef4444;font-weight:800;font-size:13px;margin-left:2px;border:1px solid rgba(239,68,68,0.4);white-space:nowrap;">계산중...</span></div>',
anchor: new naver.maps.Point(12, 24)
}
});

map.setCenter(targetCoord);
map.setZoom(19);

document.getElementById('cancel-nav-btn').style.display = 'block';

if (currentPos) {
drawNavLine(currentPos, targetCoord);
updateTargetDistanceText(currentPos, targetCoord);
}
}

function drawNavLine(start, end) {
if (navLine) navLine.setMap(null);
navLine = new naver.maps.Polyline({
map: map,
path: [start, end],
strokeColor: '#22c55e',
strokeWeight: 5,
strokeOpacity: 0.9
});
}

function cancelNavigation() {
window.activeTarget = null;
if (targetMarker) {
targetMarker.setMap(null);
targetMarker = null;
}
if (navLine) {
navLine.setMap(null);
navLine = null;
}
document.getElementById('cancel-nav-btn').style.display = 'none';
document.getElementById('search-input').value = '';
}
