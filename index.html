<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
• { box-sizing: border-box; }
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0b0f19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
#map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
.leaflet-control-zoom { display: none !important; }

#title {
position: absolute; top: 12px; width: 100%; text-align: center; z-index: 1000;
font-size: 19px; font-weight: 800; color: #ffffff;
text-shadow: 0 2px 8px rgba(0,0,0,0.8); pointer-events: none;
letter-spacing: 1.5px;
}

#search-box {
position: absolute; top: 52px; left: 16px; right: 16px; z-index: 1000;
background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
padding: 8px 12px; border-radius: 30px; display: flex; align-items: center;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.2);
}
#search-input {
flex: 1; background: transparent; border: none; padding: 6px 8px;
font-size: 14px; color: #ffffff; outline: none; text-transform: uppercase;
min-width: 0;
}
#search-input::placeholder { color: rgba(255, 255, 255, 0.4); }
#search-btn {
background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none;
border-radius: 20px; padding: 8px 14px; font-weight: 700; font-size: 12px; cursor: pointer;
white-space: nowrap;
box-shadow: 0 4px 15px rgba(59, 130, 246, 0.5);
flex-shrink: 0;
}

#status {
position: absolute; bottom: 24px; left: 16px; z-index: 1000;
background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
padding: 10px 16px; border-radius: 14px; font-size: 12px; color: #cbd5e1;
border: 1px solid rgba(255, 255, 255, 0.15); max-width: 65%; word-break: break-all;
box-shadow: 0 6px 25px rgba(0,0,0,0.6);
}

.zone-label {
color: #ffffff; font-weight: 900; font-size: 16px;
text-shadow: 0 0 6px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.9), 0 4px 8px rgba(0,0,0,0.7);
text-align: center; letter-spacing: 1px;
}

#btn {
position: absolute; bottom: 24px; right: 16px; z-index: 1000;
width: 56px; height: 56px; background: linear-gradient(135deg, #f97316, #c2410c);
border-radius: 50%; color: white; font-size: 24px; border: none;
box-shadow: 0 8px 25px rgba(249, 115, 22, 0.6); cursor: pointer;
display: flex; align-items: center; justify-content: center;
}
</style>
</head>
<body>
<div id="title">아산출고 치장장 MAP</div>

<div id="search-box">
<input type="text" id="search-input" placeholder="검색 예: Y1001, Y1101">
<button id="search-btn" onclick="searchLocation()">로케이션 검색</button>
</div>

<div id="status">GPS 연결 대기 중...</div>
<button id="btn" onclick="if(currentPos) map.setView(currentPos, 19);">📍</button>
<div id="map"></div>

<script>
var map = L.map('map', {zoomControl: false}).setView([36.8522, 126.8610], 18);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
maxZoom: 21,
subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
}).addTo(map);

var marker = L.circleMarker([0,0], {
radius: 9, fillColor: '#22c55e', fillOpacity: 1, color: '#ffffff', weight: 2
});
var targetMarker = null;
var navLine = null;
var statusDiv = document.getElementById('status');
var currentPos = null;

var zoneStyles = {
"PA": {color: "#38bdf8", fill: "#38bdf8"},
"P": {color: "#818cf8", fill: "#818cf8"},
"Y": {color: "#facc15", fill: "#facc15"},
"C": {color: "#34d399", fill: "#34d399"},
"B": {color: "#fb7185", fill: "#fb7185"},
"A": {color: "#c084fc", fill: "#c084fc"},
"수출": {color: "#22d3ee", fill: "#22d3ee"},
"배송동": {color: "#fbbf24", fill: "#fbbf24"},
"R": {color: "#f472b6", fill: "#f472b6"},
"RA": {color: "#a78bfa", fill: "#a78bfa"},
"KA": {color: "#4ade80", fill: "#4ade80"},
"K": {color: "#60a5fa", fill: "#60a5fa"},
"JA": {color: "#fb923c", fill: "#fb923c"},
"J": {color: "#e879f9", fill: "#e879f9"},
"IA": {color: "#2dd4bf", fill: "#2dd4bf"},
"I": {color: "#818cf8", fill: "#818cf8"},
"H": {color: "#facc15", fill: "#facc15"},
"HA": {color: "#34d399", fill: "#34d399"},
"HB": {color: "#fb7185", fill: "#fb7185"},
"N": {color: "#38bdf8", fill: "#38bdf8"},
"M": {color: "#c084fc", fill: "#c084fc"},
"L": {color: "#4ade80", fill: "#4ade80"}
};

var zones = [
{name:"PA", coords:[[36.8525,126.85911],[36.8525,126.8603],[36.8521,126.8603],[36.8519,126.8602],[36.8517,126.8600],[36.8517,126.85911]], label:[36.8522,126.8596]},
{name:"P", coords:[[36.8525,126.8604],[36.8525,126.8613],[36.8520,126.8613],[36.8520,126.8604]], label:[36.8522,126.8607]},
{name:"Y", coords:[
[36.8505, 126.8576],[36.85085, 126.85820],[36.85085, 126.85870],[36.84890, 126.85870],[36.8499, 126.8576]], label:[36.8502, 126.8580]},
{name:"C", coords:[[36.85085,126.85875],[36.85085,126.8599],[36.84867,126.8599],[36.84867,126.85875]], label:[36.8502,126.8592]},
{name:"B", coords:[[36.85085,126.8600],[36.85085,126.86112],[36.84867,126.86112],[36.84867,126.8600]], label:[36.8502,126.8605]},
{name:"A", coords:[[36.85085,126.86122],[36.85085,126.86238],[36.84867,126.86238],[36.84867,126.86122]], label:[36.8502,126.8617]},
{name:"수출", coords:[[36.8486,126.8585],[36.8486,126.8635],[36.8463,126.8635],[36.8463,126.8585]], label:[36.8477,126.8612]},
{name:"배송동", coords:[[36.85085,126.8624],[36.85085,126.8635],[36.84867,126.8635],[36.84867,126.8624]], label:[36.8502,126.8629]},
{name:"R", coords:[[36.8500,126.8639],[36.8500,126.86597],[36.84863,126.86597],[36.84863,126.8644],[36.8488,126.8639]], label:[36.8493,126.8649]},
{name:"RA", coords:[[36.8508,126.8639],[36.8508,126.86597],[36.85005,126.86597],[36.85005,126.8639]], label:[36.8504,126.8648]},
{name:"KA", coords:[[36.8484,126.8639],[36.8486,126.8644],[36.8486,126.86597],[36.84785,126.86597],[36.84785,126.8639]], label:[36.8482,126.8648]},
{name:"K", coords:[[36.8478,126.8639],[36.8478,126.86597],[36.84644,126.86597],[36.84644,126.8642],[36.8467,126.8639]], label:[36.8471,126.8649]},
{name:"JA", coords:[[36.85005,126.86602],[36.8509,126.86602],[36.8509,126.8678],[36.85005,126.8678]], label:[36.8504,126.8668]},
{name:"J", coords:[[36.8500,126.86602],[36.84863,126.86602],[36.84863,126.8678],[36.8500,126.8678]], label:[36.8493,126.8669]},
{name:"IA", coords:[[36.84785,126.86602],[36.8486,126.86602],[36.8486,126.8679],[36.84785,126.8679]], label:[36.8482,126.8668]},
{name:"I", coords:[[36.8478,126.86602],[36.8478,126.8679],[36.84644,126.8679],[36.84644,126.86602]], label:[36.8471,126.8669]},
{name:"H", coords:[[36.84785,126.86815],[36.84785,126.86935],[36.8465,126.86935],[36.8465,126.86815]], label:[36.8472,126.8687]},
{name:"HA", coords:[[36.8479,126.86815],[36.8486,126.86815],[36.8486,126.86935],[36.8479,126.86935]], label:[36.8482,126.8688]},
{name:"HB", coords:[[36.84863,126.86815],[36.8500,126.86815],[36.8500,126.86935],[36.84863,126.86935]], label:[36.8493,126.8688]},
{name:"N", coords:[[36.84592,126.8653],[36.84592,126.86722],[36.84455,126.86722],[36.84455,126.8668],[36.84580,126.8653], label:[36.8453,126.8666]},
{name:"M", coords:[[36.84592,126.8672],[36.84592,126.8687],[36.8445,126.8687],[36.8445,126.8672]], label:[36.8453,126.8681]},
{name:"L", coords:[[36.84592,126.8687],[36.84592,126.8702],[36.8442,126.8702],[36.8442,126.8692],[36.8445,126.8692],[36.8445,126.8687]], label:[36.8453,126.8695]}
];

zones.forEach(z => {
try {
var style = zoneStyles[z.name] || {color: "#facc15", fill: "#facc15"};
L.polygon(z.coords, {
color: style.color,
weight: 2.5,
fillColor: style.fill,
fillOpacity: 0.18,
dashArray: null
}).addTo(map);

L.marker(z.label, {
icon: L.divIcon({className: 'zone-label', html: z.name})
}).addTo(map);
} catch(err) {
console.error("오류:", z.name);
}
});

setTimeout(function() { map.invalidateSize(); }, 200);

if (navigator.geolocation) {
navigator.geolocation.watchPosition(
p => {
currentPos = [p.coords.latitude, p.coords.longitude];
marker.setLatLng(currentPos);
if (!map.hasLayer(marker)) marker.addTo(map);
statusDiv.innerHTML = "GPS 수신 중 (오차: " + Math.round(p.coords.accuracy) + "m)";
if (window.activeTarget) drawNavLine(currentPos, window.activeTarget);
},
e => { statusDiv.innerHTML = "GPS 오류: " + e.message; },
{ enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
);
}

function parseY1Location(query) {
var match = query.match(/^Y(10|11)(\d{2})$/);
if (!match) return null;
var sideType = match[1];
var num = parseInt(match[2], 10);
if (num < 1 || num > 55) return null;
var southLat = 36.8490;
var northLat = 36.8507;
var ratio = (num - 1) / 54;
var targetLat = southLat + (northLat - southLat) * ratio;
var targetLng = (sideType === "10") ? 126.85867 : 126.85863;
return [targetLat, targetLng];
}

function searchLocation() {
var query = document.getElementById('search-input').value.trim().toUpperCase();
var targetCoord = parseY1Location(query);
if (!targetCoord) {
alert("올바르지 않은 형식입니다: " + query + "\n(입력 예시: Y1001~Y1055, Y1101~Y1155)");
return;
}
window.activeTarget = targetCoord;
if (targetMarker) map.removeLayer(targetMarker);
targetMarker = L.marker(targetCoord).addTo(map).bindPopup("<b>목적지: " + query + "</b>").openPopup();
map.setView(targetCoord, 19);
if (currentPos) drawNavLine(currentPos, targetCoord);
}

function drawNavLine(start, end) {
if (navLine) map.removeLayer(navLine);
navLine = L.polyline([start, end], {color: '#22c55e', weight: 5, opacity: 0.9, smoothFactor: 1}).addTo(map);
}
// 지도를 클릭하면 해당 위치의 위도, 경도를 팝업창으로 바로 보여주는 기능
map.on('click', function(e) {
var lat = e.latlng.lat.toFixed(6);
var lng = e.latlng.lng.toFixed(6);
alert("위도: " + lat + ", 경도: " + lng);
console.log("[" + lat + ", " + lng + "]");
});
</script>
</body>
</html>
